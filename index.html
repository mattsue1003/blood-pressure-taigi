<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="長者線上社區課程互動簡報：看懂血壓機的三個數字、量血壓的姿勢與 722 原則、紀錄與看診提問，後半段坐姿運動。">
<title>血壓機講啥物？｜台語互動衛教＋坐姿運動</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --orange:#E8552D; --amber:#F4A93C; --teal:#028090; --ink:#12343B;
  --sdg:#B23A48; --ex:#3E8E5A;
  --bg:#FBF7F0; --card:#FFFFFF; --line:#E3D9C8;
  --good:#2E7D4F; --bad:#C0392B;
  --shadow:0 6px 22px rgba(18,52,59,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  background:var(--ink); color:var(--ink); overflow:hidden;
}
button{font-family:inherit}
#stage{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
#bar{height:8px;background:#EFE6D6;flex:0 0 auto}
#barfill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--orange));transition:width .3s}
#slides{flex:1 1 auto;position:relative;overflow:hidden}

/* --s 由自動縮放引擎設定：每頁把內容撐到剛好填滿畫面 */
.slide{--s:1;--hs:min(var(--s),1.16);position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(28px*var(--s)) calc(50px*var(--s)) calc(var(--ch,64px) + 14px + var(--nh,0px));overflow:auto}
.slide.on{display:flex;animation:in .32s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- typography ---------- */
.tag{display:inline-block;background:var(--sdg);color:#fff;font-weight:800;
  font-size:calc(22px*var(--hs));padding:.28em .9em;border-radius:999px;letter-spacing:.05em}
.tag.q{background:var(--orange)}
.tag.core{background:var(--teal)}
.tag.ex{background:var(--ex)}
h2{font-size:calc(54px*var(--hs));line-height:1.22;font-weight:900;margin:.2em 0 .06em}
.lead{font-size:calc(28px*var(--hs));line-height:1.5;font-weight:600;color:#3B4F55}
.lead b{color:var(--orange)}
.hd{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;margin-bottom:calc(16px*var(--s))}
.body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:calc(18px*var(--s))}
.src{flex:0 0 auto;padding-top:.8em;font-size:calc(15px*var(--hs));color:#8A8272;font-weight:600}
.body>.grid{flex:1 1 auto;align-content:stretch;grid-auto-rows:minmax(0,1fr)}
.body>.opts{flex:1 1 auto;grid-auto-rows:minmax(0,1fr)}

/* ---------- cover ---------- */
.cover{background:linear-gradient(135deg,var(--ink),#0C5A63 55%,var(--teal));color:#fff;
  justify-content:center;overflow:hidden}
.cover .numwrap{position:absolute;inset:0;overflow:hidden;z-index:0}
.cover h1{color:#fff;font-size:min(14vh,9.4vw);line-height:1.04;font-weight:900;letter-spacing:-.01em}
.cover .sub{font-size:min(5.4vh,4.2vw);font-weight:700;color:#FFDCA8;margin-top:.45em}
.cover .num{position:absolute;right:-1.5vw;top:50%;transform:translateY(-50%);
  font-size:min(62vh,38vw);font-weight:900;color:rgba(244,169,60,.15);line-height:.78;
  letter-spacing:-.05em;pointer-events:none;z-index:0}
.cover .body{position:relative;z-index:1;max-width:78%}
.cover .meta{margin-top:min(4.5vh,3.4vw);font-size:min(2.6vh,1.9vw);color:#BFE3E6;font-weight:700;line-height:1.7}
.cover .kick{font-size:min(2.8vh,2.1vw);font-weight:800;color:#FFDCA8;letter-spacing:.06em}
.cover .brand{display:inline-block;margin-top:min(3vh,2.2vw);background:rgba(255,255,255,.14);border-radius:999px;
  padding:.4em 1.1em;font-size:min(2.6vh,1.9vw);font-weight:900;color:#fff}

/* ---------- cards ---------- */
.grid{display:grid;gap:calc(20px*var(--s))}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g1{grid-template-columns:1fr}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;
  padding:calc(24px*var(--s));box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;gap:.4em}
.card .k{font-size:calc(30px*var(--s));font-weight:900;color:var(--orange);line-height:1.25}
.card .v{font-size:calc(24px*var(--s));font-weight:600;line-height:1.55;color:#3B4F55}
.card .v b{color:var(--ink)}
.card.teal{border-color:#9ED2D6}.card.teal .k{color:var(--teal)}
.card.amber{border-color:#F6D8A0}.card.amber .k{color:#B9741C}
.card.tl-g{border-color:#8CCB9F;background:#F3FBF5}.card.tl-g .k{color:#2E7D4F}
.card.tl-y{border-color:#F2C14E;background:#FFFAEB}.card.tl-y .k{color:#946300}
.card.tl-r{border-color:#E8A08C;background:#FFF5F1}.card.tl-r .k{color:#C0392B}
.card.tl-x{border-color:#C0392B;background:#FDECE9}.card.tl-x .k{color:#A5281B}

/* ---------- interactive（選擇題） ---------- */
.qtext{font-size:calc(42px*var(--hs));font-weight:900;line-height:1.32;margin-bottom:.25em}
.opts{display:grid;gap:calc(13px*var(--s));align-content:center}
.opt{display:flex;align-items:center;gap:.7em;background:var(--card);border:4px solid var(--line);
  border-radius:18px;padding:calc(20px*var(--s)) calc(28px*var(--s));cursor:pointer;
  font-size:calc(33px*var(--s));font-weight:800;line-height:1.35;text-align:left;color:var(--ink);
  transition:border-color .15s,background .15s;box-shadow:var(--shadow)}
.opt:hover{border-color:var(--amber)}
.opt .ltr{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;background:var(--teal);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:.85em}
.opt.right{border-color:var(--good);background:#E8F6ED}.opt.right .ltr{background:var(--good)}
.opt.wrong{border-color:var(--bad);background:#FBEBE9;opacity:.75}.opt.wrong .ltr{background:var(--bad)}
.opt.lock{cursor:default}
.ch2{flex:1 1 auto;gap:calc(26px*var(--s))}
.ch2 .rt{display:flex;flex-direction:column;gap:calc(14px*var(--s))}
.mon-wrap{display:flex;justify-content:center}
.mon{display:block;width:100%;max-width:100%}

.fb{background:#FFF6E4;border:3px dashed var(--amber);border-radius:18px;
  padding:calc(20px*var(--s));font-size:calc(26px*var(--s));font-weight:700;line-height:1.55;color:#5A4415}
.fb.idle{background:transparent;border-color:#E7DDCB;color:#A99C86;font-weight:600;
  display:flex;align-items:center;justify-content:center;text-align:center}
.fb b{color:var(--orange)}

/* ---------- 答案彈窗 ---------- */
#ans{position:fixed;inset:0;z-index:55;background:rgba(8,24,28,.82);display:none;
  place-items:center;padding:4vh 4vw}
#ans.on{display:grid}
.ans-card{background:var(--bg);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.45);
  max-width:min(1150px,94vw);max-height:90vh;overflow:auto;width:100%;
  padding:clamp(26px,4vh,52px) clamp(26px,4vw,60px);text-align:center;
  display:flex;flex-direction:column;gap:clamp(12px,2vh,24px);animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(24px)}to{opacity:1;transform:none}}
.ans-ico{font-size:clamp(56px,10vh,110px);line-height:1}
.ans-t{font-size:clamp(30px,5vh,58px);font-weight:900;color:var(--ink)}
.ans-b{font-size:clamp(20px,3.2vh,35px);font-weight:700;line-height:1.7;color:#3B4F55;text-align:left;
  background:#FFF6E4;border:3px dashed var(--amber);border-radius:20px;
  padding:clamp(16px,2.4vh,30px) clamp(18px,2.4vw,34px)}
.ans-b b{color:var(--orange)}
.ans-ok{align-self:center}

.acts{display:flex;flex-wrap:wrap;gap:calc(14px*var(--s));align-items:center}
.btn{background:var(--teal);color:#fff;border:none;border-radius:999px;cursor:pointer;
  padding:.5em 1.4em;font-size:calc(25px*var(--s));font-weight:900;box-shadow:var(--shadow)}
.btn.gh{background:#fff;color:var(--teal);border:3px solid var(--teal)}
.btn.or{background:var(--orange)}
.btn.on{background:var(--amber);color:var(--ink)}
.btn:active{transform:translateY(2px)}
.cnt{font-size:calc(26px*var(--s));font-weight:900;color:var(--orange)}
.off{display:none!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- 開場：據點打招呼 ---------- */
.gr-box{background:#fff;border:3px solid var(--line);border-radius:22px;padding:calc(20px*var(--s)) calc(24px*var(--s));
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:calc(14px*var(--s))}
.gr-t{font-size:calc(24px*var(--s));font-weight:900;color:var(--teal)}
.sites{display:flex;flex-wrap:wrap;gap:calc(14px*var(--s))}
.site{background:#FFF6E4;border:4px solid var(--amber);border-radius:16px;cursor:pointer;
  padding:calc(14px*var(--s)) calc(22px*var(--s));font-size:calc(30px*var(--s));font-weight:900;color:var(--ink);
  box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:.4em}
.site .hi{font-size:.9em;opacity:.35}
.site.on{background:#E8F6ED;border-color:var(--good)}
.site.on .hi{opacity:1}
.site .del{font-style:normal;font-size:.6em;color:#A99C86;margin-left:.2em}
.site-add{display:flex;gap:calc(10px*var(--s));flex-wrap:wrap;align-items:center}
.site-add input{font-family:inherit;font-size:calc(22px*var(--s));font-weight:700;border:3px solid var(--line);
  border-radius:12px;padding:.35em .7em;min-width:12em;background:#FFFDF8}
.site-add .btn{font-size:calc(20px*var(--s))}
.gest{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(16px*var(--s))}
.gc{background:#fff;border:3px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:calc(16px*var(--s));text-align:center;display:flex;flex-direction:column;gap:.2em;justify-content:center}
.gc .e{font-size:calc(64px*var(--s));line-height:1.1}
.gc .k{font-size:calc(30px*var(--s));font-weight:900;color:var(--orange)}
.gc .v{font-size:calc(21px*var(--s));font-weight:700;color:#5D6E72;line-height:1.4}

/* ---------- 圈叉題 ---------- */
.ox-prog{display:flex;gap:calc(10px*var(--s));justify-content:center}
.ox-prog i{width:calc(18px*var(--s));height:calc(18px*var(--s));border-radius:50%;background:#E3D9C8}
.ox-prog i.cur{background:var(--orange)}
.ox-prog i.ok{background:var(--good)}.ox-prog i.ng{background:var(--bad)}
.ox-stack{display:grid}
.ox-q{grid-area:1/1;background:#fff;border:4px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  padding:calc(30px*var(--s)) calc(36px*var(--s));font-size:calc(48px*var(--s));font-weight:900;line-height:1.4;
  text-align:center;display:flex;align-items:center;justify-content:center}
.ox-q:not(.cur){visibility:hidden}
.ox-q .qn{color:var(--orange);margin-right:.3em}
.ox-btns{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:calc(22px*var(--s))}
.oxb{background:#fff;border:5px solid var(--line);border-radius:26px;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;
  padding:calc(14px*var(--s));font-size:calc(32px*var(--s));font-weight:900;color:var(--ink);transition:border-color .15s,background .15s,transform .15s,opacity .15s}
.oxb:hover{border-color:var(--amber)}
.oxb .big{font-size:calc(110px*var(--s));line-height:1}
.oxb .gs{font-size:calc(21px*var(--s));font-weight:700;color:#7A8A8E}
.oxb.right{border-color:var(--good);background:#E8F6ED}
.oxb.wrong{border-color:var(--bad);background:#FBEBE9}
.oxb.lock{cursor:default}

/* ---------- 血壓機三個數字 ---------- */
.mt{flex:1 1 auto;gap:calc(28px*var(--s))}
.mcards{display:flex;flex-direction:column;gap:calc(16px*var(--s))}
.mc{position:relative;background:#fff;border:4px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:calc(16px*var(--s)) calc(22px*var(--s));cursor:pointer;transition:border-color .2s,background .2s,transform .2s,opacity .2s}
.mc .k{font-size:calc(31px*var(--s));font-weight:900;color:var(--sdg)}
.mc .tw{font-size:calc(22px*var(--s));font-weight:800;color:var(--teal);margin:.1em 0 .2em}
.mc .v{font-size:calc(23px*var(--s));font-weight:600;line-height:1.5;color:#3B4F55}
.mc .v b{color:var(--orange)}
.mc .qm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(30px*var(--s));font-weight:900;color:#A99C86;background:#FBF7F0;border-radius:16px}
.mc.on{border-color:var(--sdg)}
.mc.on .qm{display:none}
.mc:not(.on) .k,.mc:not(.on) .tw,.mc:not(.on) .v{visibility:hidden}
.mon .mrow{fill:transparent;cursor:pointer;transition:fill .2s}
.mon .mrow:hover{fill:rgba(244,169,60,.22)}
.mon .mrow.hl{fill:rgba(244,169,60,.38)}
.mon .mrow.glow{fill:rgba(232,85,45,.42);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{fill:rgba(232,85,45,.18)}to{fill:rgba(232,85,45,.5)}}
.mon .mtag{opacity:0;transition:opacity .3s}
.mon .mtag.on{opacity:1}

/* ---------- 看圖找錯 ---------- */
.pic{flex:1 1 auto;gap:calc(22px*var(--s))}
.pic-svg{display:block;width:100%;background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pic-side{display:flex;flex-direction:column;gap:calc(14px*var(--s))}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:calc(10px*var(--s))}
.slot{background:#fff;border:3px solid var(--line);border-radius:14px;padding:.35em .55em;
  font-size:calc(21px*var(--s));font-weight:800;color:#A99C86;line-height:1.3;display:flex;gap:.4em;align-items:center}
.slot .sn{flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;background:#D8CEBB;color:#fff;
  display:grid;place-items:center;font-size:.85em}
.slot.bad{border-color:var(--bad);background:#FBEBE9;color:#8E2B20}.slot.bad .sn{background:var(--bad)}
.slot.good{border-color:var(--teal);background:#E6F4F5;color:#0A5A62}.slot.good .sn{background:var(--teal)}
.slot.show{border-color:var(--amber);background:#FFF3D6;color:#8A5A00}.slot.show .sn{background:var(--amber)}
.hs{cursor:pointer}
.hs .ring{fill:none;stroke:var(--amber);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.8);opacity:0}}
.hs .bdg{fill:var(--teal);stroke:#fff;stroke-width:3}
.hs text{fill:#fff;font-weight:900;font-size:20px;pointer-events:none}
.hs.found .bdg{fill:var(--bad)}.hs.safe .bdg{fill:var(--good)}.hs.show .bdg{fill:var(--amber)}
.hs.found .ring,.hs.safe .ring,.hs.show .ring{display:none}
.hs.miss{animation:shake .35s}

/* ---------- 正確姿勢（跟我做） ---------- */
.pose{flex:1 1 auto;gap:calc(24px*var(--s))}
.steps{display:flex;flex-direction:column;gap:calc(12px*var(--s))}
.stp{background:#fff;border:4px solid var(--line);border-radius:18px;cursor:pointer;box-shadow:var(--shadow);
  padding:calc(12px*var(--s)) calc(18px*var(--s));display:flex;align-items:center;gap:.6em;text-align:left;color:var(--ink);transition:border-color .15s,background .15s,transform .15s,opacity .15s}
.stp .sn{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;background:var(--teal);color:#fff;
  display:grid;place-items:center;font-size:calc(26px*var(--s));font-weight:900}
.stp .tx{display:block}
.stp .k{display:block;font-size:calc(32px*var(--s));font-weight:900;color:var(--orange)}
.stp .v{display:block;font-size:calc(21px*var(--s));font-weight:700;color:#5D6E72;line-height:1.4}
.stp:hover{border-color:var(--amber)}
.stp.on{border-color:var(--orange);background:#FFF1DE}
.stp.on .sn{background:var(--orange)}
.pbd .bdg{fill:var(--teal);stroke:#fff;stroke-width:3}
.pbd text{fill:#fff;font-weight:900;font-size:20px}
.pbd.on .bdg{fill:var(--orange)}
.pbd .ring{fill:none;stroke:var(--orange);stroke-width:5;opacity:0;transform-box:fill-box;transform-origin:center}
.pbd.on .ring{animation:ring 1.2s ease-out infinite}

/* ---------- 722 紀錄 ---------- */
.rec{flex:1 1 auto;gap:calc(26px*var(--s))}
.r722{display:flex;flex-direction:column;gap:calc(12px*var(--s))}
.rd{background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:calc(10px*var(--s)) calc(18px*var(--s));display:flex;align-items:center;gap:calc(16px*var(--s))}
.rd .dg{flex:0 0 auto;font-size:calc(84px*var(--s));font-weight:900;color:var(--orange);line-height:1;width:1em;text-align:center}
.rd .dt{display:block}
.rd .dk{display:block;font-size:calc(29px*var(--s));font-weight:900;color:var(--ink)}
.rd .dv{display:block;font-size:calc(20px*var(--s));font-weight:700;color:#5D6E72;line-height:1.45}
.sheet{background:#FFFEF8;border:3px solid #D9CDB4;border-radius:18px;box-shadow:var(--shadow);
  padding:calc(16px*var(--s)) calc(18px*var(--s));
  background-image:repeating-linear-gradient(#FFFEF8 0 calc(46px*var(--s)),#EEF3F8 calc(46px*var(--s)) calc(48px*var(--s)))}
.sheet .st{font-size:calc(26px*var(--s));font-weight:900;color:var(--teal);margin-bottom:.3em}
.rtab{width:100%;border-collapse:collapse;font-size:calc(25px*var(--s));font-weight:800}
.rtab th{background:#E6F4F5;color:var(--teal);padding:.35em .3em;border:2px solid #C9DEE0;font-size:.85em}
.rtab td{padding:.4em .3em;border:2px solid #E3D9C8;text-align:center;color:#1F4E8C}
.rtab td.nt{color:#8A5A00;font-size:.85em}
.rtab .p{font-size:.75em;color:#B23A48}

/* ---------- 電影法（默片＋辯士） ---------- */
.fm{flex:1 1 auto;display:flex;flex-direction:column;gap:calc(14px*var(--s));min-height:0}
.vbox{display:flex;justify-content:center}
.fvid{display:block;height:calc(600px*var(--s));aspect-ratio:16/9;max-width:100%;border-radius:18px;background:#000;box-shadow:var(--shadow)}
.btn.pulse{animation:bp 1s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.08)}}
.tasks{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(18px*var(--s))}
.film{position:relative;background:#18120C;border-radius:18px;box-shadow:var(--shadow);
  padding:calc(14px*var(--s)) calc(48px*var(--s))}
.film::before,.film::after{content:"";position:absolute;top:8px;bottom:8px;width:calc(22px*var(--s));
  background:repeating-linear-gradient(to bottom,transparent 0 calc(9px*var(--s)),#E9DFC8 calc(9px*var(--s)) calc(23px*var(--s)),transparent calc(23px*var(--s)) calc(32px*var(--s)));
  border-radius:4px;opacity:.85}
.film::before{left:calc(13px*var(--s))}.film::after{right:calc(13px*var(--s))}
.fstage{position:relative;height:calc(290px*var(--s));border-radius:10px;overflow:hidden;
  background:radial-gradient(ellipse at center,#F6E7C8 0%,#E2C597 62%,#B8935F 100%);animation:flick 3s infinite}
@keyframes flick{0%,100%{filter:brightness(1)}47%{filter:brightness(1)}50%{filter:brightness(.92)}53%{filter:brightness(1.03)}}
.fstage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(rgba(60,40,20,.55) 1px,transparent 1.4px),radial-gradient(rgba(60,40,20,.4) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;animation:grain .4s steps(3) infinite}
@keyframes grain{0%{background-position:0 0,3px 5px}33%{background-position:4px 2px,0 1px}66%{background-position:1px 5px,6px 2px}}
.fstage .it{position:absolute;transform:translate(-50%,-50%);line-height:1;white-space:nowrap;font-size:calc(var(--fz)*1px*var(--s));
  filter:sepia(.55) saturate(.8) contrast(1.05);animation:fin .6s ease}
.fstage .it.num{font-weight:900;color:#5A2A1A;filter:none;font-family:"Courier New",monospace;letter-spacing:-.04em}
@keyframes fin{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}
.ftitle{margin-top:calc(10px*var(--s));background:#0E0B08;color:#F3E9D2;border:4px double #CDB88E;border-radius:8px;
  text-align:center;font-family:"PMingLiU","MingLiU","Songti TC","Noto Serif TC",serif;font-weight:900;
  font-size:calc(36px*var(--s));line-height:1.45;padding:.35em .8em;display:flex;align-items:center;justify-content:center}
.fscn{font-size:calc(20px*var(--s));font-weight:800;color:#CDB88E;text-align:center;margin-top:.3em}
.slide[data-mode="f"] .lead,.slide[data-mode="v"] .lead{display:none}
.vote-q{font-size:calc(38px*var(--hs));font-weight:900;line-height:1.32}
.vote-opts{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(16px*var(--s))}
.vo{background:var(--card);border:4px solid var(--line);border-radius:20px;cursor:pointer;color:var(--ink);
  padding:calc(22px*var(--s));font-size:calc(30px*var(--s));font-weight:800;line-height:1.45;
  box-shadow:var(--shadow);transition:border-color .15s,background .15s;position:relative;
  display:flex;flex-direction:column;justify-content:center;gap:.4em;text-align:left}
.vo:hover{border-color:var(--amber)}
.vo.on{background:linear-gradient(135deg,#FFF1DE,#FFE1B8);border-color:var(--orange)}
.vo .ltr2{font-size:.8em;color:var(--teal)}
.vo .cntn{font-size:calc(44px*var(--s));font-weight:900;color:var(--orange)}

/* ---------- 運動頁 ---------- */
.mvx{flex:1 1 auto;gap:calc(24px*var(--s))}
.figbox{position:relative;background:linear-gradient(#FFF8EC,#F4E6CF);border:3px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.figbox svg{display:block;width:100%}
.beat{position:absolute;top:calc(12px*var(--s));right:calc(12px*var(--s));background:var(--orange);color:#fff;
  border-radius:20px;padding:.25em .7em;text-align:center;min-width:3.6em;box-shadow:var(--shadow)}
.beat .bn{display:block;font-size:calc(60px*var(--s));font-weight:900;line-height:1}
.beat .bl{display:block;font-size:calc(22px*var(--s));font-weight:900;line-height:1.3;min-height:1.3em}
.beat.pop{animation:bpop .3s}
@keyframes bpop{50%{transform:scale(1.15)}}
.mr{display:flex;flex-direction:column;gap:calc(13px*var(--s))}
.cue{display:flex;gap:.55em;align-items:center;background:#fff;border:4px solid var(--line);border-radius:18px;
  padding:calc(12px*var(--s)) calc(18px*var(--s));font-size:calc(31px*var(--s));font-weight:900;line-height:1.35;box-shadow:var(--shadow);transition:border-color .2s,background .2s,transform .2s,opacity .2s}
.cue .cn{flex:0 0 auto;width:1.55em;height:1.55em;border-radius:50%;background:#C9BFAE;color:#fff;display:grid;place-items:center;font-size:.8em}
.cue.on{border-color:var(--orange);background:#FFF1DE}
.cue.on .cn{background:var(--orange)}
.mchips{display:flex;flex-wrap:wrap;gap:calc(10px*var(--s))}
.mchip{background:#E6F4F5;color:#0A5A62;border-radius:14px;padding:.3em .7em;font-size:calc(22px*var(--s));font-weight:800;line-height:1.35}
.mchip.r{background:#FFF1DE;color:#9A4A12}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:calc(12px*var(--s))}
.lv{border-radius:16px;padding:calc(10px*var(--s)) calc(14px*var(--s));font-size:calc(21px*var(--s));font-weight:700;line-height:1.45}
.lv b{display:block;font-size:1.1em}
.lv.e{background:#EAF6EE;border:3px solid #A6D6B6;color:#245E3B}
.lv.h{background:#FFF3E2;border:3px solid #F3CE91;color:#7A4A0E}
.safe{background:#FBEBE9;border-left:8px solid var(--bad);border-radius:12px;padding:calc(10px*var(--s)) calc(14px*var(--s));
  font-size:calc(21px*var(--s));font-weight:800;color:#8E2B20;line-height:1.45}

/* 腦力遊戲 */
.gm{flex:1 1 auto;gap:calc(26px*var(--s))}

.gcall{background:#fff;border:4px solid var(--orange);border-radius:24px;box-shadow:var(--shadow);text-align:center;
  font-size:calc(84px*var(--s));font-weight:900;color:var(--orange);line-height:1.2;padding:.15em .3em}
.gcall.pop{animation:bpop .35s}
.grules{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(14px*var(--s))}
.gr{background:#fff;border:4px solid var(--line);border-radius:20px;box-shadow:var(--shadow);text-align:center;
  padding:calc(12px*var(--s));display:flex;flex-direction:column;gap:.15em;justify-content:center;transition:border-color .2s,background .2s,transform .2s,opacity .2s}
.gr .e{font-size:calc(56px*var(--s));line-height:1.15}
.gr .k{font-size:calc(28px*var(--s));font-weight:900;color:var(--sdg)}
.gr .a{font-size:calc(23px*var(--s));font-weight:800;color:#3B4F55;line-height:1.35}
.gr.hit{border-color:var(--orange);background:#FFF1DE;transform:scale(1.05)}
.rev-note{font-size:calc(22px*var(--s));font-weight:800;color:var(--bad);text-align:center;min-height:1.4em}

/* 呼吸 */
.br{flex:1 1 auto;gap:calc(26px*var(--s))}
.bwrap{display:grid;place-items:center;height:calc(400px*var(--s))}
.bcirc{width:calc(380px*var(--s));height:calc(380px*var(--s));border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#D9F0F1,#5BB5BC 55%,#028090);display:grid;place-items:center;
  color:#fff;transform:scale(.55);box-shadow:0 0 0 calc(10px*var(--s)) rgba(2,128,144,.12)}

/* 兩欄版面：用 flex（grid 的 fr 欄會把右欄算高，縮放引擎就縮得太小） */
.ch2,.mt,.pic,.pose,.rec,.mvx,.gm,.br{display:flex;align-items:center}
.ch2>*,.mt>*,.pic>*,.pose>*,.rec>*,.mvx>*,.gm>*,.br>*{min-width:0}
.ch2>:first-child{flex:.85 1 0}.ch2>:last-child{flex:1.25 1 0}
.mt>:first-child{flex:.9 1 0}.mt>:last-child{flex:1.2 1 0}
.pic>:first-child{flex:1.7 1 0}.pic>:last-child{flex:1 1 0}

.pose.has-img>:first-child{flex:1.75 1 0}
.rec>:first-child{flex:.95 1 0}.rec>:last-child{flex:1.25 1 0}
.mvx>:first-child{flex:1 1 0}.mvx>:last-child{flex:1.12 1 0}
.gm>:first-child{flex:.85 1 0}.gm>:last-child{flex:1.2 1 0}
.br>:first-child{flex:1 1 0}.br>:last-child{flex:1 1 0}

.sec-lead{font-size:calc(38px*var(--hs));font-weight:700;line-height:1.6;color:#3B4F55}
.sec-h{font-size:calc(84px*var(--hs));font-weight:900;line-height:1.12;color:var(--ink)}
.pl{background:var(--card);border:4px solid var(--line);border-radius:20px;cursor:pointer;
  padding:calc(22px*var(--s));font-size:calc(29px*var(--s));font-weight:800;line-height:1.4;
  box-shadow:var(--shadow);transition:border-color .15s,background .15s;position:relative;
  display:flex;align-items:center}
.pl:hover{border-color:var(--amber)}
.pl.on{background:linear-gradient(135deg,#FFF1DE,#FFE1B8);border-color:var(--orange)}
.pl.on::after{content:"✓";position:absolute;top:-.4em;right:-.25em;width:1.5em;height:1.5em;border-radius:50%;
  background:var(--orange);color:#fff;display:grid;place-items:center;font-size:.9em}
.plc-line{font-size:calc(30px*var(--s));font-weight:900;color:var(--orange);text-align:center}
.sc-em{font-size:calc(130px*var(--s));line-height:1}
.sc-big{font-size:calc(72px*var(--s));font-weight:900;color:var(--orange)}
.sc-t{font-size:calc(38px*var(--s));font-weight:800;color:#3B4F55}
.sc-p{font-size:calc(30px*var(--s));font-weight:700;color:#5D6E72;line-height:1.7;margin-top:.4em}
.sc-p b{color:var(--orange)}

/* ---------- chrome（固定尺寸，不隨頁面縮放） ---------- */
#chrome{position:fixed;left:0;right:0;bottom:0;height:clamp(48px,5.6vh,64px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(14px,2vw,32px);background:rgba(18,52,59,.94);color:#fff;z-index:40}
#chrome .l,#chrome .r{display:flex;align-items:center;gap:clamp(6px,.9vw,14px)}
.cbtn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;cursor:pointer;
  padding:.45em .9em;font-size:clamp(13px,1.15vw,18px);font-weight:800}
.cbtn:hover{background:rgba(255,255,255,.3)}
.cbtn.on{background:var(--amber);color:var(--ink)}
#pg{font-size:clamp(13px,1.15vw,18px);font-weight:800;color:#BFE3E6}
#star{font-size:clamp(14px,1.25vw,20px);font-weight:900;color:var(--amber)}
#note{position:fixed;left:0;right:0;bottom:clamp(48px,5.6vh,64px);z-index:39;display:none;
  background:#FFF6E4;border-top:5px solid var(--amber);padding:clamp(10px,1.3vw,22px) clamp(16px,2.4vw,44px);
  font-size:clamp(14px,1.35vw,22px);font-weight:700;line-height:1.55;color:#5A4415;max-height:36vh;overflow:auto}
#note.on{display:block}
#note b{color:var(--orange)}
#note .say{display:block;margin-bottom:.4em;padding:.4em .7em;background:#12343B;color:#FFE9C2;border-radius:10px}
#note .say b{color:#F4A93C}
#timer{position:fixed;top:clamp(16px,2vh,28px);right:clamp(16px,2vw,32px);z-index:41;display:none;
  background:var(--orange);color:#fff;border-radius:20px;padding:.3em .9em;font-size:clamp(26px,3.4vw,58px);
  font-weight:900;box-shadow:var(--shadow)}
#timer.on{display:block}
#timer.low{background:var(--bad);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#toc{position:fixed;inset:0;z-index:57;background:rgba(8,24,28,.88);display:none;place-items:center;padding:4vh 4vw}
#toc.on{display:grid}
.toc-card{background:var(--bg);border-radius:24px;width:min(1180px,94vw);max-height:88vh;overflow:auto;
  padding:clamp(18px,3vh,36px) clamp(18px,3vw,40px);box-shadow:0 24px 80px rgba(0,0,0,.45)}
.toc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8em;
  font-size:clamp(20px,2.4vw,32px);font-weight:900}
.toc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.toc-it{background:#fff;border:3px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;color:var(--ink);
  padding:.55em .8em;font-size:clamp(14px,1.3vw,19px);font-weight:800;line-height:1.35}
.toc-it:hover{border-color:var(--amber)}
.toc-it.cur{border-color:var(--orange);background:#FFF1DE}
.toc-it i{font-style:normal;color:var(--teal);margin-right:.4em}
.toc-sec{grid-column:1/-1;font-size:clamp(15px,1.4vw,20px);font-weight:900;color:var(--sdg);margin-top:.4em}

/* ---------- 放大特寫（看圖找錯） ---------- */
#zoom{position:fixed;inset:0;z-index:56;background:rgba(8,24,28,.86);display:none;place-items:center;padding:3vh 3vw}
#zoom.on{display:grid}
.zm-card{background:var(--bg);border-radius:26px;box-shadow:0 24px 80px rgba(0,0,0,.45);width:min(1280px,95vw);max-height:93vh;overflow:auto;
  display:flex;gap:clamp(14px,2vw,30px);padding:clamp(14px,2.2vw,30px);align-items:center;animation:pop .25s ease}
.zm-view{position:relative;flex:1.45 1 0;min-width:0;aspect-ratio:4/3;border-radius:18px;background-color:#fff;background-repeat:no-repeat;
  border:4px solid var(--line);overflow:hidden}
.zm-ring{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;border:7px solid var(--amber);transform:translate(-50%,-50%);
  animation:zr 1.4s ease-in-out infinite;pointer-events:none}
@keyframes zr{50%{border-color:rgba(244,169,60,.25)}}
.zm-side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px)}
.zm-no{font-size:clamp(20px,2.3vw,32px);font-weight:900;color:var(--teal)}
.zm-q{font-size:clamp(30px,3.8vw,56px);font-weight:900;line-height:1.25;color:var(--ink)}
.zm-hint{font-size:clamp(18px,1.9vw,28px);font-weight:800;color:#7A8A8E}
.zm-ans{border-radius:18px;padding:clamp(12px,1.6vw,22px);font-weight:700;line-height:1.6;font-size:clamp(19px,2.1vw,30px)}
.zm-ans b{color:inherit;text-decoration:underline;text-underline-offset:.15em}
.zm-ans.bad{background:#FBEBE9;border:3px solid var(--bad);color:#6E2219}
.zm-ans.good{background:#E8F6ED;border:3px solid var(--good);color:#1C5B39}
.zm-t{font-size:1.3em;font-weight:900;margin-bottom:.15em}
.zm-acts{display:flex;gap:12px;flex-wrap:wrap}
.zm-acts .btn{font-size:clamp(18px,1.9vw,28px)}
@media(max-width:820px){.zm-card{flex-direction:column;align-items:stretch}.zm-view{flex:none;width:100%}}

/* ---------- 插圖 ---------- */
.cv-img{position:absolute;right:4vw;top:50%;transform:translateY(-50%);z-index:1;
  width:min(40vw,60vh*1.5);aspect-ratio:3/2;object-fit:cover;border-radius:26px;
  box-shadow:0 18px 50px rgba(0,0,0,.35);border:6px solid rgba(255,255,255,.9)}
.cover.has-img .body{max-width:52%}
.cover.has-img h1{font-size:min(11.5vh,6.4vw)}
.cover.has-img .sub{font-size:min(4.6vh,3vw)}
.poster{flex:0 0 auto;display:block;height:calc(360px*var(--s));aspect-ratio:3/4;object-fit:cover;
  border-radius:14px;border:6px solid #2A2117;box-shadow:var(--shadow);background:#2A2117}
.fm-tasks.has-poster{display:flex;gap:calc(20px*var(--s));align-items:stretch}
.fm-tasks.has-poster .tasks{flex:1 1 auto}
.pimg{flex:0 0 auto;display:block;height:calc(340px*var(--s));aspect-ratio:3/2;object-fit:cover;
  border-radius:20px;box-shadow:var(--shadow);border:4px solid #fff}
.pts-img{flex:1 1 auto;display:flex;gap:calc(22px*var(--s));align-items:center}
.pts-img>.grid{flex:1 1 0;min-width:0;align-self:stretch;grid-auto-rows:minmax(0,1fr)}
.gr-top{display:flex;gap:calc(18px*var(--s));align-items:center}
.gr-top>.gr-box{flex:1 1 auto;min-width:0}
.gimg{flex:0 0 auto;display:block;height:calc(210px*var(--s));aspect-ratio:3/2;object-fit:cover;border-radius:18px;box-shadow:var(--shadow);border:4px solid #fff}

/* ---------- 手機／小螢幕：改成可上下捲動，不硬塞進一個畫面 ---------- */
#chrome{padding-bottom:env(safe-area-inset-bottom)}
.mob .slide{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-left:calc(18px*var(--s));padding-right:calc(18px*var(--s))}
.mob .body{justify-content:flex-start}
.mob .body>.grid,.mob .body>.opts{grid-auto-rows:auto}
.mob #tbtn,.mob #fbtn,.mob .lg{display:none}
.mob #chrome{height:auto;min-height:52px;flex-wrap:nowrap;padding-left:10px;padding-right:10px;gap:6px}
.mob #chrome .l,.mob #chrome .r{gap:6px}
.mob .cbtn{padding:.5em .8em;font-size:16px}
.mob #pg,.mob #star{font-size:15px}
.mob .fstage{height:auto;aspect-ratio:1000/360;container-type:inline-size}
.mob .fstage .it{font-size:calc(var(--fz)*.1cqw)}
.mob .film{padding-left:calc(40px*var(--s));padding-right:calc(40px*var(--s))}
.mob .cover .body{max-width:100%}
.mob .cover{justify-content:flex-start}
.mob .cv-img{position:static;transform:none;width:100%;margin-top:18px;order:2}
.mob .cover.has-img .body{max-width:100%}
.mob .cover.has-img h1{font-size:min(14vh,9.4vw)}
.mob .cover.has-img .sub{font-size:min(5.4vh,4.6vw)}
.mob .fm{flex:0 0 auto}
.mob .fvid{height:auto;width:100%}
.mob .fm-tasks.has-poster,.mob .pts-img,.mob .gr-top{flex-direction:column;align-items:stretch}
.mob .poster{height:auto;width:62%;align-self:center}
.mob .pimg,.mob .gimg{height:auto;width:100%}
.mob .pic-svg{height:auto!important;width:100%!important}
.swipe-tip{display:none}
.mob .swipe-tip{display:block;margin-top:1.2em;font-size:15px;color:#BFE3E6;font-weight:700}
@media(max-width:820px){
  .g2,.g3{grid-template-columns:1fr}
  .g4,.gest{grid-template-columns:repeat(2,1fr)}
  .mt,.pic,.pose,.rec,.mvx,.gm,.br,.ch2{flex-direction:column;align-items:stretch}
  .ch2>*,.mt>*,.pic>*,.pose>*,.rec>*,.mvx>*,.gm>*,.br>*{flex:none!important;width:100%}
  .tasks,.vote-opts{grid-template-columns:1fr}
}

</div>

</div>

<script>
/* =========================================================================
   教案資料 — 前段：衛教問答（含兩段電影法）｜後段：坐姿運動
   ========================================================================= */
const DECK = {
  title:"血壓機講啥物？",
  slides:[

/* 1 */ {t:"cover", num:"722", kicker:"線上社區健康課程｜台語開講",
  h:"血壓機講啥物？", sub:"做伙看懂健康數字",

const C={skin:"#F2C9A5",skinD:"#DDB08A",shirt:"#028090",shirtD:"#016470",coat:"#C9822F",coatD:"#9C6223",
  pants:"#3A4A57",pantsD:"#29353F",shoe:"#2A2A2A",hair:"#E6E6E6",wood:"#B8875A",woodD:"#8E6440"};
const rad=d=>d*Math.PI/180;
const f1=n=>n.toFixed(1);
function ln(a,b,w,c,cap){return `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap||"round"}"/>`}
const mix=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
function ik(a,b,l1,l2,bend){
  const dx=b[0]-a[0],dy=b[1]-a[1],D=Math.hypot(dx,dy)||.001;
  const Dc=Math.min(l1+l2-.5,Math.max(Math.abs(l1-l2)+.5,D));
  const A=Math.acos(Math.max(-1,Math.min(1,(l1*l1+Dc*Dc-l2*l2)/(2*l1*Dc))));
  const ang=Math.atan2(dy,dx)+bend*A;
  return [a[0]+l1*Math.cos(ang),a[1]+l1*Math.sin(ang)];
}
function reach(j,tg,l){const dx=tg[0]-j[0],dy=tg[1]-j[1],d=Math.hypot(dx,dy)||1;return [j[0]+dx/d*l,j[1]+dy/d*l]}
const BASE={H:[130,222],t:0,hd:0,nh:[198,214],fh:[190,212],na:[214,306],fa:[206,306],nf:0,ff:0};
const P=o=>Object.assign({},BASE,o||{});
function lerpPose(a,b,u){const o={};for(const k in BASE){const x=a[k],y=b[k];
  o[k]=Array.isArray(x)?[x[0]+(y[0]-x[0])*u,x[1]+(y[1]-x[1])*u]:x+(y-x)*u}return o}
function solve(p){
  const H=p.H,t=p.t,S=[H[0]+100*Math.sin(rad(t)),H[1]-100*Math.cos(rad(t))];
  const hc=[S[0]+40*Math.sin(rad(t+p.hd)),S[1]-40*Math.cos(rad(t+p.hd))];
  const nE=ik(S,p.nh,62,58,1),fE=ik(S,p.fh,62,58,1),nK=ik(H,p.na,84,84,-1),fK=ik(H,p.fa,84,84,-1);
  return {H,S,hc,nE,nW:reach(nE,p.nh,58),fE,fW:reach(fE,p.fh,58),nK,nA:reach(nK,p.na,84),fK,fA:reach(fK,p.fa,84)};
}
function legSVG(H,K,A,f,far){
  const c=far?C.pantsD:C.pants, sh=Math.atan2(A[0]-K[0],A[1]-K[1])*180/Math.PI, ph=rad(sh+90-f);
  const d=[Math.sin(ph),Math.cos(ph)], heel=[A[0]-d[0]*8,A[1]-d[1]*8], toe=[A[0]+d[0]*26,A[1]+d[1]*26];
  return ln(H,K,30,c)+ln(K,A,24,c)+ln(heel,toe,15,far?"#161616":C.shoe);
}
function armSVG(S,E,W,far,o){
  const sc=far?(o.coat?C.coatD:C.shirtD):(o.coat?C.coat:C.shirt), sk=far?C.skinD:C.skin;
  let g="";
  if(o.short){const m=mix(S,E,.5);g+=ln(S,m,far?20:24,sc)+ln(m,E,17,sk)}
  else g+=ln(S,E,(o.coat&&!far)?34:21,sc);
  return g+ln(E,W,16,sk)+`<circle cx="${f1(W[0])}" cy="${f1(W[1])}" r="9.5" fill="${sk}"/>`;
}
function headSVG(c,o){
  const [x,y]=c;
  let g=`<circle cx="${f1(x-5)}" cy="${f1(y-4)}" r="28" fill="${C.hair}"/>
  <circle cx="${f1(x-30)}" cy="${f1(y-15)}" r="11.5" fill="${C.hair}"/>
  <circle cx="${f1(x+2)}" cy="${f1(y+2)}" r="25" fill="${C.skin}"/>
  <path d="M${f1(x-22)} ${f1(y-5)} Q ${f1(x-6)} ${f1(y-31)} ${f1(x+23)} ${f1(y-13)}" stroke="${C.hair}" stroke-width="11" fill="none" stroke-linecap="round"/>
  <circle cx="${f1(x+14)}" cy="${f1(y-1)}" r="3.2" fill="#2A2A2A"/>
  <circle cx="${f1(x+14)}" cy="${f1(y-1)}" r="8.5" fill="none" stroke="#7A6450" stroke-width="2.4"/>
  ${ln([x+5.5,y-2],[x-6,y-4],2.4,"#7A6450")}
  <circle cx="${f1(x+9)}" cy="${f1(y+10)}" r="5" fill="#F0A58A" opacity=".55"/>
  <path d="M${f1(x+25)} ${f1(y)} q 5 5 -1 8" stroke="#D49A78" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  g+=o.talk?`<ellipse cx="${f1(x+18)}" cy="${f1(y+15)}" rx="4.5" ry="5.5" fill="#7A2B2B"/>`
           :`<path d="M${f1(x+12)} ${f1(y+14)} Q ${f1(x+17)} ${f1(y+18)} ${f1(x+22)} ${f1(y+13)}" stroke="#7A2B2B" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  return g;
}
function chairSVG(){
  return `<ellipse cx="170" cy="320" rx="120" ry="7" fill="rgba(0,0,0,.08)"/>
  <rect x="86" y="102" width="14" height="136" rx="6" fill="${C.woodD}"/>
  <rect x="90" y="240" width="9" height="78" fill="${C.woodD}"/><rect x="196" y="240" width="9" height="78" fill="${C.woodD}"/>
  <rect x="82" y="230" width="130" height="13" rx="6" fill="${C.wood}"/>`;
}
function figure(p,o={}){
  const J=solve(p); let g="";
  if(o.chair!==false) g+=chairSVG();
  if(o.pre) g+=o.pre;
  g+=armSVG(J.S,J.fE,J.fW,true,o);
  g+=legSVG(J.H,J.fK,J.fA,p.ff,true);
  g+=ln(J.S,mix(J.S,J.hc,.6),16,C.skin);
  g+=ln(J.H,J.S,46,o.coat?C.coat:C.shirt);
  g+=legSVG(J.H,J.nK,J.nA,p.nf,false);
  g+=headSVG(J.hc,o);
  if(o.phone){const W=J.fW;g+=`<rect x="${f1(W[0]-9)}" y="${f1(W[1]-18)}" width="17" height="32" rx="4" fill="#333" transform="rotate(-18 ${f1(W[0])} ${f1(W[1])})"/>`}
  g+=armSVG(J.S,J.nE,J.nW,false,o);
  if(o.cuff){const a=mix(J.S,J.nE,.3),b=mix(J.S,J.nE,.8),m=mix(J.S,J.nE,.55);
    g+=ln(a,b,o.coat?42:30,"#2F3E4E","butt")+ln(mix(a,b,.15),mix(a,b,.85),3,"#4F6378","butt");
    if(o.tube)g+=`<path d="M${f1(m[0])} ${f1(m[1]-8)} C ${f1(m[0]+30)} ${f1(m[1]-70)} ${o.tube[0]-40} ${o.tube[1]-60} ${o.tube[0]} ${o.tube[1]}" stroke="#55606B" stroke-width="4" fill="none"/>`}
  if(o.post) g+=o.post;
  return g;
}

/* 插畫（點陣圖）＋號碼：號碼用原本 470 寬的尺寸設計，依圖寬等比放大。
   x,y＝物件位置（放大特寫的中心）；bx,by＝號碼擺放位置（放在物件旁，不蓋住細節） */
function photoScene(s,marks,cls){
  const k=(s.iw/470).toFixed(3);
  return `<svg class="pic-svg" viewBox="0 0 ${s.iw} ${s.ih}" style="height:calc(${s.ph||470}px*var(--s));width:auto;max-width:100%;aspect-ratio:${s.iw}/${s.ih};margin:0 auto" xmlns="http://www.w3.org/2000/svg">
  <image href="${s.img}" width="${s.iw}" height="${s.ih}"/>`+
  marks.map((m,i)=>`<g class="${cls}" data-i="${i}" transform="translate(${m.bx??m.x} ${m.by??m.y}) scale(${k})">
    <circle class="ring" r="17"/><circle r="26" fill="transparent"/><circle class="bdg" r="17"/><text text-anchor="middle" y="7">${i+1}</text></g>`).join("")+`</svg>`;

/* ---------- 放大特寫 ---------- */
const ZM=$("#zoom"); let zmCtx=null;
function zmShowAns(on){
  const c=zmCtx; if(!c)return;
  $(".zm-q",ZM).classList.toggle("off",on&&!c.keepQ); $(".zm-hint",ZM).classList.toggle("off",on||!c.hint);
  $(".zm-go",ZM).classList.toggle("off",on);
  const a=$(".zm-ans",ZM); a.classList.toggle("off",!on);
  if(on){ a.className="zm-ans "+c.cls; $(".zm-t",a).innerHTML=c.t; $(".zm-b",a).innerHTML=c.b; }
}
function openZoom(c){
  zmCtx=c; ZM.classList.add("on");
  $(".zm-no",ZM).textContent=c.no; $(".zm-q",ZM).innerHTML=c.q||"這樣做，可以嗎？"; $(".zm-hint",ZM).textContent=c.hint||"";
  zmShowAns(!!c.revealed);
  const v=$(".zm-view",ZM);
  requestAnimationFrame(()=>{
    const W=v.clientWidth,H=v.clientHeight,z=c.z||2.6,cw=c.iw/z,chh=Math.min(c.ih,cw*H/W),sc=W/cw;
    const x0=Math.max(0,Math.min(c.iw-cw,c.x-cw/2)), y0=Math.max(0,Math.min(c.ih-chh,c.y-chh/2));
    v.style.backgroundImage=`url(${c.img})`;
    v.style.backgroundSize=(c.iw*sc)+"px "+(c.ih*sc)+"px";
    v.style.backgroundPosition=(-x0*sc)+"px "+(-y0*sc)+"px";
    const r=$(".zm-ring",v); r.style.left=((c.x-x0)*sc)+"px"; r.style.top=((c.y-y0)*sc)+"px";
  });
}
function closeZoom(){ if(!ZM.classList.contains("on"))return; ZM.classList.remove("on"); const c=zmCtx; zmCtx=null; if(c&&c.onClose)c.onClose(); }
$(".zm-go",ZM).onclick=()=>{ if(zmCtx&&zmCtx.onReveal)zmCtx.onReveal(); zmShowAns(true); };
$(".zm-x",ZM).onclick=closeZoom;
ZM.addEventListener("click",e=>{ if(e.target===ZM)closeZoom() });

/* ---------- 建立投影片 ---------- */
DECK.slides.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="slide"+(s.t==="cover"?" cover":"")+(s.t==="cover"&&s.img?" has-img":"");
  d.dataset.i=i;
  d.innerHTML=(R[s.t]||R.points)(s);
  wrap.appendChild(d);
  bind(d,s,i);
});
DECK.slides.forEach(s=>{
  if(s.t==="choice")maxStar+=1;
  if(s.t==="ox")maxStar+=s.items.length;
  if(s.t==="pic")maxStar+=s.need;
});

/* ---------- 互動綁定 ---------- */
function bind(d,s,i){

  if(s.t==="choice"){
    $$(".opt",d).forEach(b=>b.onclick=()=>{
      if(d.dataset.done)return; d.dataset.done=1;
      const k=+b.dataset.i, ok=k===s.ans;
      $$(".opt",d).forEach(x=>{x.classList.add("lock");
        if(+x.dataset.i===s.ans)x.classList.add("right");
        else if(x===b)x.classList.add("wrong")});
      if(ok)addStar(1); ding(ok);
      setTimeout(()=>d.classList.contains("on")&&showAns(ok?"🎉":"💡", ok?"答對了！":"正確答案是第 "+"1234"[s.ans]+" 個", s.fb),800);
    });
  }

  if(s.t==="greet"){
    const box=$(".sites",d), inp=$("input",d);
    let list=s.sites.slice();
    try{const sv=JSON.parse(localStorage.getItem("bp-taigi-sites")||"null"); if(Array.isArray(sv)&&sv.length)list=sv}catch(e){}
    const save=()=>{try{localStorage.setItem("bp-taigi-sites",JSON.stringify(list))}catch(e){}};
    const paint=()=>{ box.innerHTML=list.map((n,k)=>`<button class="site" data-k="${k}"><span class="hi">👋</span><span>${n.replace(/</g,"&lt;")}</span>${k>=s.sites.length?'<i class="del" title="移除">✕</i>':""}</button>`).join("");
      $$(".site",box).forEach(b=>b.onclick=e=>{
        if(e.target.classList.contains("del")){list.splice(+b.dataset.k,1);save();paint();fit(d);return}
        b.classList.toggle("on"); if(b.classList.contains("on"))ding(1);
      }); };
    paint();
    const add=()=>{const v=inp.value.trim(); if(!v)return; list.push(v); inp.value=""; save(); paint(); fit(d)};
    $(".add",d).onclick=add;
    inp.addEventListener("keydown",e=>{e.stopPropagation(); if(e.key==="Enter")add()});
  }

  if(s.t==="ox"){
    let cur=0;
    const qs=$$(".ox-q",d), dots=$$(".ox-prog i",d), bs=$$(".oxb",d), nx=$(".nx",d);
    const show=()=>{ qs.forEach((q,k)=>q.classList.toggle("cur",k===cur));
      dots.forEach((t,k)=>t.classList.toggle("cur",k===cur));
      bs.forEach(b=>b.className="oxb"); nx.classList.add("off"); d.dataset.lock=""; };
    show();
    bs.forEach(b=>b.onclick=()=>{
      if(d.dataset.lock)return; d.dataset.lock=1;
      const it=s.items[cur], v=b.dataset.v==="1", ok=v===it.a;
      bs.forEach(x=>{x.classList.add("lock"); if((x.dataset.v==="1")===it.a)x.classList.add("right"); else if(x===b)x.classList.add("wrong")});
      dots[cur].classList.add(ok?"ok":"ng");
      if(ok)addStar(1); ding(ok);
      if(cur<s.items.length-1)nx.classList.remove("off");
      setTimeout(()=>d.classList.contains("on")&&showAns(ok?"🎉":"💡", ok?"答對了！":"答案是 "+(it.a?"⭕ 對":"❌ 不對"), it.fb),750);
    });
    nx.onclick=()=>{ if(cur<s.items.length-1){cur++;show()} };
    $(".rs",d).onclick=()=>{ cur=0; dots.forEach(t=>t.className=""); show(); };
  }

  if(s.t==="meter"){
    const open=k=>{ $$(".mc",d)[k].classList.add("on"); $$(".mtag",d)[k].classList.add("on");
      $$(".mrow",d).forEach((r,j)=>r.classList.toggle("hl",j===k)); ding(1); };
    $$(".mrow",d).forEach(r=>r.onclick=()=>open(+r.dataset.k));
    $$(".mc",d).forEach(c=>c.onclick=()=>open(+c.dataset.k));
    $(".all",d).onclick=()=>[0,1,2].forEach(k=>{$$(".mc",d)[k].classList.add("on");$$(".mtag",d)[k].classList.add("on")});
    $(".rs",d).onclick=()=>{ $$(".mc,.mtag",d).forEach(x=>x.classList.remove("on")); $$(".mrow",d).forEach(r=>r.classList.remove("hl")); };
  }

  if(s.t==="pic"){
    const why=$(".why",d); let n=0;
    const L=s.hs.reduce((a,g)=>(g.n+(g.why||g.ok)).length>(a.n+(a.why||a.ok)).length?g:a);
    why.dataset.full='⚠️ <b>'+L.n+'</b>：'+(L.why||L.ok);
    const slot=k=>$$(".slot",d)[k];
    const summary=()=>d.classList.contains("on")&&showAns("🏆","太棒了，"+s.need+" 個錯誤全部找到！",s.fb);
    const reveal=k=>{
      const h=$$(".hs",d)[k], g=s.hs[k];
      if(h.classList.contains("found")||h.classList.contains("safe"))return;
      if(g.d){ h.classList.add("safe"); ding(1); slot(k).className="slot good"; $(".sl",slot(k)).textContent="👍 "+g.n;
        why.innerHTML="👍 <b>"+g.n+"</b>：這樣做很好——"+g.ok; why.classList.remove("idle"); return; }
      h.classList.remove("show"); h.classList.add("found"); slot(k).className="slot bad"; $(".sl",slot(k)).textContent="⚠ "+g.n;
      why.innerHTML="⚠️ <b>"+g.n+"</b>："+g.why; why.classList.remove("idle");
      if(!d.dataset.done){ n++; addStar(1); $(".c0",d).textContent=n; }
      ding(1);
      if(n>=s.need&&!d.dataset.done){ d.dataset.done=1; d.dataset.sum=1;
        if(!ZM.classList.contains("on")){ d.dataset.sum=""; setTimeout(summary,1100) } }
    };
    $$(".hs",d).forEach(h=>h.onclick=()=>{
      const k=+h.dataset.i, g=s.hs[k];
      if(!s.img){ reveal(k); return; }
      const done=h.classList.contains("found")||h.classList.contains("safe")||h.classList.contains("show");
      openZoom({img:s.img,iw:s.iw,ih:s.ih,x:g.x,y:g.y,z:g.z,no:"第 "+(k+1)+" 號",hint:"請大家比 ⭕ 可以，或 ❌ 不行",
        revealed:done, cls:g.w?"bad":"good",
        t:g.w?"❌ 不行！"+g.n:"⭕ 可以！"+g.n, b:g.w?g.why:g.ok,
        onReveal:()=>reveal(k),
        onClose:()=>{ if(d.dataset.sum==="1"){ d.dataset.sum=""; setTimeout(summary,250) } }});
    });
    $(".sw",d).onclick=()=>{
      $$(".hs",d).forEach(h=>{const k=+h.dataset.i,g=s.hs[k];
        if(g.w&&!h.classList.contains("found")){h.classList.add("show");slot(k).className="slot show";$(".sl",slot(k)).textContent="⚠ "+g.n}});
      d.dataset.done=1; showAns("📖","答案都在這裡",s.fb);
    };
  }

  if(s.t==="pose"){
    const on=k=>{ $$(".stp",d).forEach((b,j)=>b.classList.toggle("on",j<=k)); $$(".pbd",d).forEach((b,j)=>b.classList.toggle("on",j===k)); ding(1) };
    $$(".stp",d).forEach(b=>b.onclick=()=>on(+b.dataset.i));
    $$(".pbd",d).forEach(b=>b.onclick=()=>{ const k=+b.dataset.i; on(k);
      if(s.img){ const m=s.marks[k]; openZoom({img:s.img,iw:s.iw,ih:s.ih,x:m.x,y:m.y,z:m.z,no:"口訣 "+(k+1),
        q:s.steps[k].k, keepQ:true, revealed:true, cls:"good", t:"👍 這樣做就對了", b:s.steps[k].v}); } });
  }

  if(s.t==="film"&&s.video){                 /* 影片版電影法：開演就直接播放 */
    const T=$(".fm-tasks",d), F=$(".fm-film",d), V=$(".fm-vote",d), v=$(".fvid",d), B=n=>$("."+n,d);
    const label=()=>{ B("v-play").textContent=v.paused?"▶ 播放":"⏸ 暫停"; };
    const mode=m=>{ d.dataset.mode=m;
      T.classList.toggle("off",m!=="t"); F.classList.toggle("off",m!=="f"); V.classList.toggle("off",m!=="v");
      B("go-film").classList.toggle("off",m!=="t");
      ["v-play","v-re","go-vote"].forEach(n=>B(n).classList.toggle("off",m!=="f"));
      B("go-task").classList.toggle("off",m==="t"); B("rsv").classList.toggle("off",m!=="v");
      if(m!=="f")v.pause();
      fit(d); if(idx===i&&noteOn){paintNote();noteSpace()} };
    B("go-film").onclick=()=>{ mode("f"); B("go-vote").classList.remove("pulse"); try{v.currentTime=0}catch(e){} v.play().catch(()=>{}); };
    B("v-play").onclick=()=>{ v.paused?v.play().catch(()=>{}):v.pause(); };
    B("v-re").onclick=()=>{ try{v.currentTime=0}catch(e){} v.play().catch(()=>{}); B("go-vote").classList.remove("pulse"); };
    v.addEventListener("play",label); v.addEventListener("pause",label);
    v.addEventListener("ended",()=>{ label(); B("go-vote").classList.add("pulse"); });
    B("go-vote").onclick=()=>{ B("go-vote").classList.remove("pulse"); mode("v"); };
    B("go-task").onclick=()=>mode("t");
    B("rsv").onclick=()=>$$(".vo",d).forEach(x=>{x.classList.remove("on");$(".cntn",x).textContent="0"});
    $$(".vo",d).forEach(x=>x.onclick=()=>{ const c=$(".cntn",x); c.textContent=(+c.textContent)+1; x.classList.add("on"); ding(1); });
    d._stop=()=>v.pause();
    d.dataset.mode="t";
  }

  if(s.t==="film"&&!s.video){
    const T=$(".fm-tasks",d), F=$(".fm-film",d), V=$(".fm-vote",d), st=$(".fstage",d), ti=$(".ftitle",d), sc=$(".fscn",d);
    const B=n=>$("."+n,d);
    let cur=0, auto=null;
    const scene=()=>{ const c=s.scenes[cur];
      st.innerHTML=c.it.map(t=>`<div class="it ${t[4]||""}" style="left:${t[1]}%;top:${t[2]}%;--fz:${t[3]}">${t[0]}</div>`).join("");
      ti.innerHTML=c.cap; sc.textContent="第 "+(cur+1)+" / "+s.scenes.length+" 幕";
      B("f-prev").disabled=cur===0; B("f-next").classList.toggle("off",cur===s.scenes.length-1||!F.offsetParent&&false);
      B("go-vote").classList.toggle("off",cur!==s.scenes.length-1);
      B("f-next").classList.toggle("off",cur===s.scenes.length-1);
      if(idx===i&&noteOn)refreshNote(); };
    const stopAuto=()=>{clearInterval(auto);auto=null;B("f-auto").classList.remove("on")};
    d._film=()=>cur;
    const mode=m=>{ stopAuto(); d.dataset.mode=m;
      T.classList.toggle("off",m!=="t"); F.classList.toggle("off",m!=="f"); V.classList.toggle("off",m!=="v");
      B("go-film").classList.toggle("off",m!=="t");
      ["f-prev","f-auto"].forEach(n=>B(n).classList.toggle("off",m!=="f"));
      B("f-next").classList.toggle("off",m!=="f"); B("go-vote").classList.toggle("off",m!=="f");
      B("go-task").classList.toggle("off",m==="t"); B("rsv").classList.toggle("off",m!=="v");
      if(m==="f")scene(); if(idx===i&&noteOn){paintNote();noteSpace()} fit(d); };
    d._stop=stopAuto;
    B("go-film").onclick=()=>{cur=0;mode("f")};
    B("f-next").onclick=()=>{stopAuto(); if(cur<s.scenes.length-1){cur++;scene()}};
    B("f-prev").onclick=()=>{stopAuto(); if(cur>0){cur--;scene()}};
    B("f-auto").onclick=()=>{ if(auto){stopAuto();return}
      B("f-auto").classList.add("on");
      auto=setInterval(()=>{ if(cur<s.scenes.length-1){cur++;scene()} else stopAuto() },6500); };
    B("go-vote").onclick=()=>mode("v");
    B("go-task").onclick=()=>mode("t");
    B("rsv").onclick=()=>$$(".vo",d).forEach(v=>{v.classList.remove("on");$(".cntn",v).textContent="0"});
    $$(".vo",d).forEach(v=>v.onclick=()=>{ const c=$(".cntn",v); c.textContent=(+c.textContent)+1; v.classList.add("on"); ding(1); });
    d.dataset.mode="t";
  }

  if(s.t==="move"){
    const svg=$(".figsvg",d), bn=$(".bn",d), bl=$(".bl",d), beat=$(".beat",d), cues=$$(".cue",d);
    const kf=s.kf.map(k=>({...k,p:P(k.p)}));
    let seg=0,t0=0,raf=0,slow=1,counting=false,count=0,from=kf[kf.length-1].p;
    const setCue=()=>{const k=kf[seg]; cues.forEach((c,j)=>c.classList.toggle("on",j===k.cue)); bl.textContent=k.lab||""};
    const frame=ts=>{
      if(!t0)t0=ts;
      const k=kf[seg], u=Math.min(1,(ts-t0)/(k.d*slow)), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      svg.innerHTML=figure(lerpPose(from,k.p,e));
      if(u>=1){
        if(k.cnt&&counting){count++;bn.textContent=count;beat.classList.remove("pop");void beat.offsetWidth;beat.classList.add("pop");tick()}
        from=k.p; seg=(seg+1)%kf.length; t0=ts; setCue();
      }
      raf=requestAnimationFrame(frame);
    };
    svg.innerHTML=figure(from);
    d._start=()=>{cancelAnimationFrame(raf);seg=0;t0=0;from=kf[kf.length-1].p;setCue();raf=requestAnimationFrame(frame)};
    d._stop=()=>cancelAnimationFrame(raf);
    const go=$(".cnt-go",d);
    go.onclick=()=>{counting=!counting; go.textContent=counting?"⏸ 暫停數":"▶ 開始數"; go.classList.toggle("on",counting)};
    $(".cnt-rs",d).onclick=()=>{count=0;bn.textContent=0};
    $(".spd",d).onclick=e=>{slow=slow===1?1.5:1; e.currentTarget.classList.toggle("on",slow>1); e.currentTarget.textContent=slow>1?"🐇 恢復速度":"🐢 放慢"};
  }

  if(s.t==="game"){
    const call=$(".gcall",d), grs=$$(".gr",d), rows=$$(".mrow",d), note=$(".rev-note",d);
    let last=-1, auto=null, rev=false, hint=null;
    const MAP=[0,1,2];
    const next=()=>{
      let k; do{k=Math.random()*3|0}while(k===last&&Math.random()<.8); last=k;
      call.textContent=s.rules[k].k+"！"; call.classList.remove("pop"); void call.offsetWidth; call.classList.add("pop");
      rows.forEach((r,j)=>r.classList.toggle("glow",j===k)); grs.forEach(g=>g.classList.remove("hit"));
      clearTimeout(hint); hint=setTimeout(()=>grs[k].classList.add("hit"),1300);  /* 顛倒時卡片上的動作已對調，所以亮同一張 */
      tick();
    };
    const stopAuto=()=>{clearInterval(auto);auto=null;$(".g-auto",d).classList.remove("on")};
    $(".g-next",d).onclick=()=>{stopAuto();next()};
    $(".g-auto",d).onclick=()=>{ if(auto){stopAuto();return} $(".g-auto",d).classList.add("on"); next(); auto=setInterval(next,4200) };
    $(".g-rev",d).onclick=e=>{ rev=!rev; e.currentTarget.classList.toggle("on",rev);
      note.textContent=rev?"🔀 顛倒挑戰：收縮壓 ⇄ 舒張壓 的動作交換！":"";
      $$(".a",d)[0].textContent=rev?s.rules[1].a:s.rules[0].a; $$(".a",d)[1].textContent=rev?s.rules[0].a:s.rules[1].a;
      $$(".e",d)[0].textContent=rev?s.rules[1].e:s.rules[0].e; $$(".e",d)[1].textContent=rev?s.rules[0].e:s.rules[1].e; };
    d._stop=()=>{stopAuto();clearTimeout(hint)};
  }

  if(s.t==="breathe"){
    const c=$(".bcirc",d), t=$(".bt",d), cues=$$(".cue",d), rn=$(".rn",d), go=$(".b-go",d);
    let tm=null, sec=0, rounds=0;
    const paint=()=>{ const inh=sec<4, n=inh?sec+1:sec-3;
      cues.forEach((q,j)=>q.classList.toggle("on",j===(inh?0:1)));
      t.innerHTML=(inh?"吸～":"吐～")+"<small>"+n+"</small>";
      if(sec===0){c.style.transition="transform 4s linear";c.style.transform="scale(1)"}
      if(sec===4){c.style.transition="transform 6s linear";c.style.transform="scale(.55)"} };
    const step=()=>{ sec++; if(sec>=10){sec=0;rounds++;rn.textContent=rounds;tick()} paint(); };
    const stop=()=>{clearInterval(tm);tm=null;go.textContent="▶ 開始";go.classList.remove("on")};
    go.onclick=()=>{ if(tm){stop();return} go.textContent="⏸ 暫停";go.classList.add("on"); sec=0; paint(); tm=setInterval(step,1000) };
    d._stop=()=>{stop(); c.style.transition="none"; c.style.transform="scale(.55)"; t.innerHTML="準備<small>按下開始</small>"; cues.forEach(q=>q.classList.remove("on"))};
  }

  if(s.t==="pledge"){
    $$(".pl",d).forEach(p=>p.onclick=()=>{
      p.classList.toggle("on"); ding(1);
      $(".plc",d).textContent=$$(".pl.on",d).length;
    });
  }
}

/* ---------- 自動縮放：把每一頁的內容撐滿畫面 ----------
   量測時先「假裝」說明框已展開（用最長的一則），揭曉答案時字級才不會突然變。 */
function isMob(){return innerWidth<=820||innerHeight<=500}
function fit(d){
  if(!d||d.classList.contains("cover")){if(d)d.style.setProperty("--s",1);return}
  const fbs=$$("[data-full]",d);
  if(document.body.classList.contains("mob")){             /* 手機：字級依寬度定，內容可以上下捲 */
    fbs.forEach(f=>f.style.minHeight="");
    let m=Math.max(.58,Math.min(1,innerWidth/560,innerHeight/470));
    d.style.setProperty("--s",m);
    let g=0; while(d.scrollWidth>d.clientWidth+1&&m>.5&&g++<12){m*=.95;d.style.setProperty("--s",m)}
    return;
  }
  const oldHTML=fbs.map(f=>f.innerHTML), wasIdle=fbs.map(f=>f.classList.contains("idle"));
  fbs.forEach(f=>{ f.style.minHeight=""; f.classList.remove("idle"); f.innerHTML=f.dataset.full });
  let lo=.45, hi=2.3, best=.45;
  for(let k=0;k<14;k++){
    const m=(lo+hi)/2;
    d.style.setProperty("--s",m);
    if(d.scrollHeight<=d.clientHeight+1 && d.scrollWidth<=d.clientWidth+1){best=m;lo=m} else hi=m;
  }
  d.style.setProperty("--s",best);
  fbs.forEach((f,k)=>{ f.style.minHeight=f.offsetHeight+"px"; f.innerHTML=oldHTML[k];
    if(wasIdle[k])f.classList.add("idle") });
  let g=0; while(d.scrollHeight>d.clientHeight+1 && best>.5 && g++<10){
    best*=.97; d.style.setProperty("--s",best); }
}
document.addEventListener("click",()=>setTimeout(()=>{
  const d=$(".slide.on"); if(!d||d.classList.contains("cover")||document.body.classList.contains("mob"))return;
  if(d.scrollHeight>d.clientHeight+2)fit(d);
},0));
let _rz; addEventListener("resize",()=>{clearTimeout(_rz);_rz=setTimeout(()=>{noteSpace();fit($(".slide.on"))},140)});

/* ---------- 答案彈窗 ---------- */
const ANS=$("#ans");
function showAns(ico,title,html){
  $(".ans-ico",ANS).textContent=ico; $(".ans-t",ANS).textContent=title;
  $(".ans-b",ANS).innerHTML=html; ANS.classList.add("on");
}
function hideAns(){ANS.classList.remove("on")}
$(".ans-ok",ANS).onclick=hideAns;
ANS.addEventListener("click",e=>{ if(e.target===ANS)hideAns() });

/* ---------- 目錄 ---------- */
const TOC=$("#toc");
function buildToc(){
  let h="", sec="";
  DECK.slides.forEach((s,k)=>{
    const ns=k<14?"前半段：看懂血壓":"後半段：坐著運動";
    if(ns!==sec){sec=ns;h+=`<div class="toc-sec">${ns}</div>`}
    h+=`<button class="toc-it ${k===idx?'cur':''}" data-k="${k}"><i>${k+1}</i>${strip(s.h)}</button>`;
  });
  $(".toc-list",TOC).innerHTML=h;
  $$(".toc-it",TOC).forEach(b=>b.onclick=()=>{TOC.classList.remove("on");go(+b.dataset.k)});
}
$(".toc-x",TOC).onclick=()=>TOC.classList.remove("on");
TOC.addEventListener("click",e=>{ if(e.target===TOC)TOC.classList.remove("on") });

/* ---------- 講師提示 ---------- */
function paintNote(){
  const s=DECK.slides[idx], d=$$(".slide")[idx];
  let h="";
  if(s.t==="film"&&!s.video&&d.dataset.mode==="f"){const c=s.scenes[d._film()];
    $("#note").innerHTML=`<span class="say">🎙 <b>辯士台詞（第 ${d._film()+1} 幕）</b>　${c.say}</span><span style="opacity:.75">（演完後回到任務、投票時，會再顯示完整講師提示）</span>`; return}
  h+=s.note?("🎙 <b>講師提示</b>　"+s.note):"（本頁無提示）";
  $("#note").innerHTML=h;
}

function noteSpace(){
  document.body.classList.toggle("mob",isMob());
  const n=$("#note"), h=noteOn?n.offsetHeight:0;
  document.documentElement.style.setProperty("--nh",h+"px");
  document.documentElement.style.setProperty("--ch",$("#chrome").offsetHeight+"px");
  n.style.bottom=$("#chrome").offsetHeight+"px";
}
function refreshNote(){ paintNote(); $("#note").classList.toggle("on",noteOn); noteSpace(); fit($(".slide.on")); }

/* ---------- 講師手冊（#notes：另開分頁或手機看） ---------- */
function renderNotes(){
  document.body.style.cssText="overflow:auto;background:#FBF7F0";
  let h=`<div style="max-width:980px;margin:0 auto;padding:28px 20px 60px;font-size:19px;line-height:1.7;color:#12343B">
  <h1 style="font-size:32px;margin-bottom:.2em">📄 講師手冊：${DECK.title}</h1>
  <p style="color:#5D6E72;font-weight:700;margin-bottom:1.2em">每一頁的帶法與台語講法。可以用手機或第二個螢幕開著，對照簡報上課。</p>`;
  DECK.slides.forEach((s,k)=>{
    h+=`<section style="background:#fff;border:2px solid #E3D9C8;border-radius:16px;padding:16px 20px;margin:14px 0">
    <div style="font-weight:900;font-size:22px"><span style="color:#028090">${k+1}.</span> ${strip(s.h)} <span style="font-size:15px;color:#B23A48">${s.tag||""}</span></div>
    <div style="margin-top:.4em;font-weight:600">${s.note||""}</div>`;
    if(s.scenes)h+=`<ol style="margin:.6em 0 0 1.4em;font-weight:600">`+s.scenes.map(c=>`<li><b>${strip(c.cap)}</b><br><span style="color:#9A4A12">🎙 辯士：${c.say}</span></li>`).join("")+`</ol>`;
    if(s.t==="ox")h+=`<ul style="margin:.6em 0 0 1.4em;font-weight:600">`+s.items.map(it=>`<li>${it.q}　→ ${it.a?"⭕":"❌"}</li>`).join("")+`</ul>`;
    if(s.t==="choice")h+=`<div style="margin-top:.4em;font-weight:700">✅ 答案：${s.opts[s.ans]}</div>`;
    if(s.t==="pic")h+=`<div style="margin-top:.4em;font-weight:700">✅ 錯的是：${s.hs.map((x,j)=>x.w?(j+1)+" "+x.n:"").filter(Boolean).join("、")}</div>`;
    h+=`</section>`;
  });
  document.body.innerHTML=h+`</div>`;
  document.title="講師手冊｜"+DECK.title;
}

/* ---------- 導覽 ---------- */
function go(n){
  const prev=$$(".slide")[idx]; if(prev&&prev._stop)prev._stop();
  idx=Math.max(0,Math.min(DECK.slides.length-1,n));
  $$(".slide").forEach((d,k)=>d.classList.toggle("on",k===idx));
  $$(".slide")[idx].scrollTop=0;
  $("#barfill").style.width=((idx+1)/DECK.slides.length*100)+"%";
  $("#pg").textContent=(idx+1)+" / "+DECK.slides.length;
  const s=DECK.slides[idx], d=$$(".slide")[idx];
  hideAns(); TOC.classList.remove("on"); ZM.classList.remove("on"); zmCtx=null;
  paintNote(); $("#note").classList.toggle("on",noteOn); noteSpace();
  if(s.t==="score"){
    $(".sc-n",d).textContent=star; $(".sc-m",d).textContent=maxStar;
    const r=maxStar?star/maxStar:0;
    $(".sc-t",d).textContent = r>=.9?"太厲害了！您就是社區的「血壓小老師」🎖"
      : r>=.6?"很棒！血壓機講的話，您聽懂了 👍" : "沒關係，記住一句就好：722，照實寫 📒";
    $(".sc-em",d).textContent = r>=.9?"🏆":r>=.6?"🎉":"🌱";
  }
  fit(d); setTimeout(()=>{ if($(".slide.on")===d)fit(d) },90);
  if(d._start)d._start();
  stopTimer();
}
$("#prev").onclick=()=>go(idx-1);
$("#next").onclick=()=>go(idx+1);
$("#nbtn").onclick=()=>{noteOn=!noteOn;$("#nbtn").classList.toggle("on",noteOn);refreshNote()};
$("#fbtn").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$("#hbtn").onclick=()=>{buildToc();TOC.classList.add("on")};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||location.hash==="#notes")return;
  if(ANS.classList.contains("on")){
    if(["Escape","Enter"," ","ArrowRight","PageDown"].includes(e.key)){e.preventDefault();hideAns()}
    return; }
  if(TOC.classList.contains("on")){ if(e.key==="Escape")TOC.classList.remove("on"); return; }
  if(ZM.classList.contains("on")){ e.preventDefault();
    if(e.key==="Escape")closeZoom();
    else if(["Enter"," ","ArrowRight"].includes(e.key)){ const g=$(".zm-go",ZM); if(!g.classList.contains("off"))g.click(); else closeZoom(); }
    return; }
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(idx+1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(idx-1)}
  else if(e.key==="Home")go(0); else if(e.key==="End")go(DECK.slides.length-1);
  else if(e.key==="n"||e.key==="N")$("#nbtn").click();
  else if(e.key==="f"||e.key==="F")$("#fbtn").click();
  else if(e.key==="t"||e.key==="T")$("#tbtn").click();
});

/* 手機左右滑動換頁（上下滑動留給捲動） */
let tx=null,ty=0;
wrap.addEventListener("touchstart",e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
wrap.addEventListener("touchend",e=>{
  if(tx===null)return; const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty; tx=null;
  if(ANS.classList.contains("on")||TOC.classList.contains("on")||ZM.classList.contains("on"))return;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(idx+(dx<0?1:-1));
},{passive:true});

/* 搶答計時器（講師自行決定要不要用） */
let tid=null;
function stopTimer(){clearInterval(tid);tid=null;$("#timer").classList.remove("on","low")}
$("#tbtn").onclick=()=>{
  if(tid){stopTimer();return}
  let n=30; const el=$("#timer"); el.textContent=n; el.classList.add("on");
  tid=setInterval(()=>{ n--; el.textContent=n;
    el.classList.toggle("low",n<=5);
    if(n<=0){ding(0);stopTimer()} },1000);
};

addEventListener("hashchange",()=>location.reload());
if(location.hash==="#notes")renderNotes(); else { go(0); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fit($(".slide.on"))); }
</script>
</body>
</html>
